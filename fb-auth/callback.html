<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FB Dashboard — Login</title>
<style>
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#0c0a09; color:#f5f0e6;
         display:flex; min-height:100vh; align-items:center; justify-content:center; text-align:center; }
  .card { padding:32px 24px; max-width:420px; }
  .mark { width:64px; height:64px; margin:0 auto 16px; border-radius:16px;
          background:linear-gradient(135deg,#FFD75E,#E8A00C); color:#1a1405;
          font-weight:bold; font-size:24px; display:flex; align-items:center; justify-content:center; }
  h1 { font-size:20px; margin:8px 0; }
  p { color:#cbbf9f; font-size:14px; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">FB</div>
    <h1>FB Dashboard</h1>
    <p>Login mukammal ho gaya hai. Ab aap is page ko band karke FB Dashboard app par wapis ja sakte hain.</p>
    <p>Login complete. You can close this page and return to the FB Dashboard app.</p>
  </div>
</body>
</html>
